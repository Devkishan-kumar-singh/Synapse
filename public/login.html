<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Login — Synapse</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="6" cy="6" r="2.6" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="6" cy="18" r="2.6" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="18" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8.2 7.2L15.8 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M8.2 16.8L15.8 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Synapse</span>
      </a>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">

      <div class="auth-heading">
        <span class="access-badge">Secure OTP access</span>
        <h1>Log in or create an account</h1>
        <p>Enter your email. We will send you a secure one-time login code.</p>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@team.com" required>

        <button type="submit" class="btn btn-primary auth-submit">Send Login Code</button>
        <p class="auth-msg" id="login-msg"></p>
      </form>
      <form id="otp-form" class="auth-form hidden">
       <label>Login code</label>
        <input type="text" id="otp-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" placeholder="Enter your code" required>
        <button type="submit" class="btn btn-primary auth-submit">Verify and Log In</button>
        <button type="button" id="change-email" class="auth-secondary">Use a different email</button>
        <p class="auth-msg" id="otp-msg"></p>
      </form>

      <form id="onboarding-form" class="auth-form hidden">
        <label>Your full name</label>
        <input type="text" id="onboarding-name" minlength="2" maxlength="100" placeholder="Your name" required>
        <label>Workspace name</label>
        <input type="text" id="onboarding-team" minlength="2" maxlength="80" placeholder="Your company or team" required>
        <button type="submit" class="btn btn-primary auth-submit">Create My Workspace</button>
        <p class="auth-msg" id="onboarding-msg"></p>
      </form>

      <p class="invite-note">New users receive a private workspace. Existing team members can also join through an administrator invitation.</p>
    </div>
  </main>

  <!-- Supabase JS client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
